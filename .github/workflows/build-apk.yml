name: Build Macrorify + Tasker Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Full Android Project (Auto-Extract or Auto-Generate)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found uploaded ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

          mkdir -p app/src/main/java/com/macrorify/tasker
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MacrorifyTaskerPro"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.macrorify.tasker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.macrorify.tasker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 165
                  versionName = "1.6.5-PRO"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isDebuggable = true
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.10.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="Macrorify + Tasker Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MacrorifyAccessibilityService"
                      android:exported="true"
                      android:label="Macrorify + Tasker Auto Clicker"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <receiver
                      android:name=".TaskerAlarmReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.macrorify.tasker.ACTION_START_MACRO" />
                          <action android:name="com.macrorify.tasker.ACTION_STOP_MACRO" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Macrorify + Tasker Pro</string>
              <string name="accessibility_service_description">Macrorify 이미지 자동 클릭 및 테스커 특정시간 시작·대기·날짜·요일 스케줄 실행 서비스</string>
          </resources>
          EOF

          if [ ! -f "app/src/main/java/com/macrorify/tasker/MainActivity.kt" ]; then
            cat << 'EOF' > app/src/main/java/com/macrorify/tasker/MainActivity.kt
          package com.macrorify.tasker

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                  }
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(AndroidNativeBridge(), "AndroidNative")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              inner class AndroidNativeBridge {
                  @JavascriptInterface
                  fun openAccessibilitySettings() {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  @JavascriptInterface
                  fun requestOverlayPermission() {
                      if (!Settings.canDrawOverlays(this@MainActivity)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  }
                  @JavascriptInterface
                  fun performNativeClick(x: Float, y: Float, durationMs: Long) {
                      MacrorifyAccessibilityService.instance?.dispatchTap(x, y, durationMs)
                  }
                  @JavascriptInterface
                  fun performNativeSwipe(x1: Float, y1: Float, x2: Float, y2: Float, durationMs: Long) {
                      MacrorifyAccessibilityService.instance?.dispatchSwipe(x1, y1, x2, y2, durationMs)
                  }
                  @JavascriptInterface
                  fun scheduleTaskerAlarm(fromTimeHms: String, toTimeHms: String, daysCsv: String, datesCsv: String, everyMinutes: Int) {
                      TaskerAlarmScheduler.scheduleNextTrigger(this@MainActivity, fromTimeHms, toTimeHms, daysCsv, datesCsv, everyMinutes)
                      runOnUiThread {
                          Toast.makeText(this@MainActivity, "테스커 예약 완료: $fromTimeHms", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF
          fi

          if [ ! -f "app/src/main/java/com/macrorify/tasker/MacrorifyAccessibilityService.kt" ]; then
            cat << 'EOF' > app/src/main/java/com/macrorify/tasker/MacrorifyAccessibilityService.kt
          package com.macrorify.tasker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class MacrorifyAccessibilityService : AccessibilityService() {
              companion object {
                  var instance: MacrorifyAccessibilityService? = null
              }
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }
              fun dispatchTap(x: Float, y: Float, durationMs: Long = 80L) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs.coerceAtLeast(10L))
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }
              fun dispatchSwipe(x1: Float, y1: Float, x2: Float, y2: Float, durationMs: Long = 350L) {
                  val path = Path().apply { moveTo(x1, y1); lineTo(x2, y2) }
                  val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs.coerceAtLeast(50L))
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }
          }
          EOF
          fi

          if [ ! -f "app/src/main/java/com/macrorify/tasker/TaskerAlarmReceiver.kt" ]; then
            cat << 'EOF' > app/src/main/java/com/macrorify/tasker/TaskerAlarmReceiver.kt
          package com.macrorify.tasker

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import java.util.Calendar

          class TaskerAlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == "com.macrorify.tasker.ACTION_START_MACRO") {
                      MacrorifyAccessibilityService.instance?.dispatchTap(340f, 195f, 80L)
                  }
              }
          }

          object TaskerAlarmScheduler {
              fun scheduleNextTrigger(context: Context, fromTimeHms: String, toTimeHms: String, daysCsv: String, datesCsv: String, everyMinutes: Int) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val parts = fromTimeHms.split(":").map { it.toIntOrNull() ?: 0 }
                  val cal = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, parts.getOrElse(0) { 9 })
                      set(Calendar.MINUTE, parts.getOrElse(1) { 0 })
                      set(Calendar.SECOND, parts.getOrElse(2) { 0 })
                      set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= System.currentTimeMillis()) add(Calendar.DAY_OF_YEAR, 1)
                  }
                  val intent = Intent(context, TaskerAlarmReceiver::class.java).apply {
                      action = "com.macrorify.tasker.ACTION_START_MACRO"
                  }
                  val pi = PendingIntent.getBroadcast(context, 1001, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
              }
          }
          EOF
          fi

          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "" | base64 -d | gunzip > app/src/main/assets/index.html
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Macrorify-Tasker-Pro-APK
          path: app/build/outputs/apk/**/*.apk
